<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato — Icognito</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Icognito</div>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="contato.html" class="nav-link">Contato</a>
            </div>
            <button id="theme-toggle" class="btn-theme">Alternar Tema</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h1>Contato</h1>
            <p>Entre em contato conosco para saber mais sobre o projeto.</p>
        </section>

        <section class="contact-container">
            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Nome</label>
                    <input type="text" id="name" name="name" required placeholder="Seu nome completo">
                </div>
                <div class="form-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" name="email" required placeholder="seu@email.com">
                </div>
                <div class="form-group">
                    <label for="message">Mensagem</label>
                    <textarea id="message" name="message" rows="5" required placeholder="Como podemos ajudar?"></textarea>
                </div>
                <button type="submit" class="btn-theme">Enviar Mensagem</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2023 Icognito — AIOS Dev Squad. Todos os direitos reservados.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
